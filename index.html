<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>划船间歇冲刺计时器 V11</title>
<style>
:root{--bg:#0b1120;--bg2:#111a2e;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.08);
--bd:rgba(255,255,255,.09);--txt:#f2f4f8;--sub:rgba(255,255,255,.55);--dim:rgba(255,255,255,.32);
--org:#F3A04C;--org2:#E58522;--red:#FF5A4A;--teal:#2BD9C4;--vio:#A98BEF;--ok:#40B43E;--warn:#EBA400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:14px 14px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 14px}
.brand{min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.brand p{margin:2px 0 0;font-size:10px;letter-spacing:2.5px;color:var(--org);font-weight:500}
.toolbar{display:flex;gap:5px;flex-shrink:0;flex-wrap:nowrap}
.tbtn{height:30px;padding:0 8px;border:.5px solid var(--bd);border-radius:8px;background:var(--card);
color:var(--sub);font-size:11px;transition:background .15s;white-space:nowrap;line-height:1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.tbtn.on{background:color-mix(in srgb,var(--org) 22%,transparent);border-color:color-mix(in srgb,var(--org) 45%,transparent);color:var(--org)}
.tbtn:active{background:var(--card2)}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.sec{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.4px;margin:0 0 10px}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.preset{border:.5px solid var(--bd);border-radius:12px;background:var(--card);padding:10px 8px;text-align:center;transition:border-color .15s,background .15s}
.preset b{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.preset span{display:block;font-size:10px;color:var(--sub);line-height:1.5}
.preset.sel{border-color:var(--org);background:color-mix(in srgb,var(--org) 14%,transparent)}
.preset.sel b{color:var(--org)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:5px}
.fld input{width:100%;height:36px;border:.5px solid var(--bd);border-radius:10px;background:var(--card2);
color:var(--txt);padding:0 10px;font-size:14px;outline:none}
.fld input:focus{border-color:var(--org)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{height:22px;display:inline-flex;align-items:center;gap:4px;border:.5px solid var(--bd);
border-radius:999px;background:var(--card2);color:var(--sub);padding:0 9px;font-size:10px}
.chip b{color:var(--org);font-weight:600}
.hint{display:flex;align-items:center;gap:7px;margin-top:12px;padding:8px 10px;border-radius:10px;
background:color-mix(in srgb,var(--vio) 12%,transparent);border:.5px solid color-mix(in srgb,var(--vio) 35%,transparent);font-size:11px;color:color-mix(in srgb,var(--vio) 75%,white)}
.vst{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 10px;border-radius:10px;
border:.5px solid var(--bd);background:var(--card2);font-size:11px}
.vst .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0}
.vst.live .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.vst.dead .dot{background:var(--red)}
.vtest{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.vtest label{font-size:11px;color:var(--sub);flex:1}
.vtest button{height:28px;padding:0 12px;border:.5px solid color-mix(in srgb,var(--org) 50%,transparent);
border-radius:8px;background:color-mix(in srgb,var(--org) 16%,transparent);color:var(--org);font-size:11px;font-weight:500}
.sens{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.sens label{font-size:11px;color:var(--sub)}
.seg{display:flex;gap:4px}
.seg button{height:26px;padding:0 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--sub);font-size:11px;white-space:nowrap}
.seg button.sel{background:color-mix(in srgb,var(--org) 22%,transparent);border-color:var(--org);color:var(--org)}
.start{width:100%;height:46px;margin-top:14px;border:0;border-radius:12px;font-size:15px;font-weight:600;
background:linear-gradient(135deg,var(--org),var(--org2));color:#1a1206;letter-spacing:1px;box-shadow:0 6px 18px rgba(243,160,76,.22)}
.start:active{filter:brightness(.94)}
.hlist{margin:0;padding:0;list-style:none}
.hrow{padding:10px 0;border-bottom:.5px solid var(--bd)}
.hrow:last-child{border-bottom:0}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htop b{font-size:12.5px;font-weight:600}
.htop .r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.htag{height:18px;display:inline-flex;align-items:center;border-radius:999px;padding:0 7px;font-size:9.5px;font-weight:600;flex-shrink:0}
.htag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border:.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.htag.ab{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);border:.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.del{height:20px;padding:0 8px;border:.5px solid color-mix(in srgb,var(--red) 45%,transparent);
border-radius:6px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-size:10px;flex-shrink:0;white-space:nowrap;line-height:1}
.del:active{filter:brightness(1.2)}
.hmid{display:flex;gap:12px;margin-top:5px;font-size:10.5px;color:var(--dim)}
.hmid span i{font-style:normal;color:var(--sub)}
.hset{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.hset em{font-style:normal;font-size:9.5px;color:var(--sub);background:var(--card2);border:.5px solid var(--bd);
border-radius:6px;padding:2px 6px}
.hset em b{color:var(--org);font-weight:600}
.hset em.v{color:var(--vio)}
.hset em.p{color:var(--teal)}
#viewRun{display:none}
.status{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.status .tag{height:24px;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 11px;font-size:11px;font-weight:600}
.status .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.warm{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal);border:.5px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.tag.work{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red);border:.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.tag.rest{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal);border:.5px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.tag.await{background:color-mix(in srgb,var(--vio) 15%,transparent);color:var(--vio);border:.5px solid color-mix(in srgb,var(--vio) 40%,transparent)}
.cancel{height:24px;padding:0 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--sub);font-size:10.5px;white-space:nowrap;flex-shrink:0}
.timerwrap{text-align:center;padding:18px 0 14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:.5px solid var(--bd)}
.timer{font-size:84px;font-weight:600;line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.timer.work{color:var(--red)} .timer.warm{color:var(--teal)} .timer.rest{color:var(--teal)} .timer.await{color:var(--vio)}
.timer.urgent{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.phase{font-size:13px;color:var(--sub);letter-spacing:1px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0%;transition:width .2s linear;background:linear-gradient(90deg,var(--org),var(--red))}
.prog{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.prog b{color:var(--txt)}
.acthint{text-align:center;font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6}
.acthint b{color:var(--vio)}
.big{width:100%;height:110px;margin-top:12px;border:.5px solid color-mix(in srgb,var(--vio) 50%,transparent);
border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--vio) 22%,transparent),color-mix(in srgb,var(--vio) 8%,transparent));
color:var(--vio);font-size:17px;font-weight:600;letter-spacing:1px;animation:breath 2s infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(.985)}}
.big:active{filter:brightness(1.1)}
.runbtns{display:flex;gap:8px;margin-top:10px}
.runbtns button{flex:1;height:38px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap}
.skipwarm{border:.5px solid color-mix(in srgb,var(--teal) 40%,transparent);background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal)}
.endall{border:.5px solid color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.demo{text-align:center;font-size:10px;color:var(--dim);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><h1>划船间歇冲刺计时器 <span style="font-size:10px;font-weight:400;color:var(--sub);letter-spacing:.5px;vertical-align:middle">V11</span></h1><p>ROWING·INTERVAL·SPRINT</p></div>
  <div class="toolbar">
    <button class="tbtn" id="btnAwake">常亮待机</button>
    <button class="tbtn" id="btnExport">下载</button>
    <button class="tbtn" id="btnBack" style="display:none">返回</button>
  </div>
</header>
<section id="viewConfig">
  <div class="card">
    <p class="sec">训练计划</p>
    <div class="presets">
      <button class="preset sel" data-p="0"><b>入门冲刺</b><span>60s 冲刺 · 60s 休息 · 5 组</span></button>
      <button class="preset" data-p="1"><b>距离冲刺</b><span>250m 全力 · 休 3 分 · 6 组</span></button>
      <button class="preset" data-p="2"><b>进阶冲刺</b><span>40s 全力 · 休 2 分 · 8 组</span></button>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="fld"><label>热身（分钟）</label><input id="inWarm" type="number" min="0" step="0.1" value="5"></div>
      <div class="fld"><label>每组冲刺（秒）</label><input id="inWork" type="number" min="5" step="1" value="60"></div>
      <div class="fld"><label>组间休息（秒）</label><input id="inRest" type="number" min="5" step="1" value="60"></div>
      <div class="fld"><label>组数</label><input id="inSets" type="number" min="1" max="20" step="1" value="5"></div>
    </div>
    <div class="summary" id="sum"></div>
    <div class="hint">🎙 语音口令：下一组 / 开始 / 8848 · 拍击手机 / 摇晃 也可激活</div>
    <div class="vst" id="vst"><span class="dot"></span><span id="vstText">语音识别：启动中…</span></div>
    <div class="vtest">
      <label>语音播报测试（每组冲刺开始时播报「第 X 组」）</label>
      <button id="btnTestVoice">测试语音</button>
    </div>
    <div class="sens">
      <label>拍击灵敏度</label>
      <div class="seg">
        <button data-s="low">灵敏</button><button data-s="mid" class="sel">标准</button><button data-s="high">迟钝</button>
      </div>
    </div>
    <button class="start" id="btnStart">开始训练</button>
  </div>
  <div class="card">
    <p class="sec">历史记录</p>
    <ul class="hlist" id="hist"></ul>
  </div>
</section>
<section id="viewRun">
  <div class="card">
    <div class="status"><span class="tag warm" id="phaseTag">热身</span><button class="cancel" id="btnCancel">结束训练</button></div>
    <div class="timerwrap">
      <div class="timer warm" id="timer">05:00</div>
      <div class="phase" id="phaseText">热身 · 轻划保持桨频 18-20</div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="prog"><span>第 <b id="curSet">0</b> 组</span><span>共 <b id="totSet">5</b> 组</span></div>
    <div class="acthint" id="actHint" style="display:none">休息结束 · 请说口令 <b>「下一组 / 开始 / 8848」</b><br>或拍击手机 / 摇晃手机 / 点击下方按钮开始第 <b id="nextSet">2</b> 组</div>
    <button class="big" id="btnActivate" style="display:none">开始下一组</button>
    <div class="runbtns">
      <button class="skipwarm" id="btnSkip">跳过热身</button>
      <button class="endall" id="btnEnd">提前结束</button>
    </div>
  </div>
</section>
<div class="demo" id="demo">· 版本 V11 · 休息结束恢复「等待激活」：语音 / 摇晃 / 拍击 / 按钮 · 历史记录可删除 · 最后 5 秒报数</div>
</div>
<script>
const $=s=>document.querySelector(s);
const P=[{w:5,wk:60,r:60,s:5,n:'入门冲刺'},{w:5,wk:110,r:180,s:6,n:'距离冲刺 250m'},{w:5,wk:40,r:120,s:8,n:'进阶冲刺'}];
let plan=0,sens='mid',hist=[];
try{hist=JSON.parse(localStorage.getItem('rit_hist')||'[]')}catch(e){}
const rec=()=>{const p=P[plan];return{w:Math.max(0,parseFloat($('#inWarm').value||0)),wk:Math.max(5,parseInt($('#inWork').value)||60),r:Math.max(5,parseInt($('#inRest').value)||60),s:Math.max(1,Math.min(20,parseInt($('#inSets').value)||5))}};
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function speak(text,queue){try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1;u.pitch=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.toLowerCase().indexOf('zh')===0)||vs.find(x=>x.lang&&x.lang.toLowerCase().indexOf('cmn')===0);if(v)u.voice=v;if(!queue)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function voiceUI(ok,msg){const el=$('#vst'),tx=$('#vstText');el.className='vst '+(ok?'live':ok===false?'dead':'');tx.textContent=msg||(ok?'语音识别：聆听中':'语音识别：已停止，恢复中…')}
function renderSum(){const c=rec();$('#sum').innerHTML='';const a=[['热身',c.w+' 分'],['冲刺',c.wk+' 秒'],['休息',c.r+' 秒'],['组数',c.s+' 组']];a.forEach(x=>{const s=document.createElement('span');s.className='chip';s.innerHTML=x[0]+' <b>'+x[1]+'</b>';$('#sum').appendChild(s)})}
function renderHist(){const ul=$('#hist');ul.innerHTML='';if(!hist.length){ul.innerHTML='<li class="hrow" style="color:var(--dim);font-size:11px">暂无记录</li>';return}
hist.slice().reverse().forEach((h,i)=>{const orig=hist.length-1-i;const li=document.createElement('li');li.className='hrow';
const pct=Math.round(h.done/h.tot*100);
let setHtml='';(h.rests||[]).forEach((r,j)=>{setHtml+='<em>第'+(j+1)+'组休 <b>'+r+'</b>s <span class='+((h.acts||[])[j]==='语音'?'v':(h.acts||[])[j]==='拍击'?'p':'')+'>'+((h.acts||[])[j]||'-')+'</span></em>'});
li.innerHTML='<div class="htop"><b>'+h.n+'</b><span class="r"><span class="htag '+(h.ok?'ok':'ab')+'">'+(h.ok?'完成 ':'提前结束 ')+h.done+'/'+h.tot+' · '+pct+'%</span><button class="del" data-i="'+orig+'">删除</button></span></div>'+
'<div class="hmid"><span>'+h.d+'</span><span>总时长 <i>'+h.total+'</i></span><span>训练 <i>'+h.wk+'s</i> / 休息 <i>'+h.r+'s</i></span></div>'+
'<div class="hset">'+setHtml+'</div>';ul.appendChild(li)});
ul.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{const idx=+b.dataset.i;if(!confirm('确定删除这条记录？'))return;hist.splice(idx,1);try{localStorage.setItem('rit_hist',JSON.stringify(hist))}catch(e){}renderHist()}))}
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{plan=+b.dataset.p;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const p=P[plan];$('#inWarm').value=p.w;$('#inWork').value=p.wk;$('#inRest').value=p.r;$('#inSets').value=p.s;renderSum()}));
['inWarm','inWork','inRest','inSets'].forEach(id=>$('#'+id).addEventListener('input',renderSum));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{sens=b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}));
let wl=null;
$('#btnAwake').addEventListener('click',()=>{const on=$('#btnAwake').classList.toggle('on');if(on){if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>$('#btnAwake').classList.remove('on'))}}else if(wl){wl.release();wl=null}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('#btnAwake').classList.contains('on')&&'wakeLock' in navigator){navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}});
$('#btnTestVoice').addEventListener('click',()=>{speak('第 1 组，开始');setTimeout(()=>speak('第 2 组，开始'),1600)});
$('#btnExport').addEventListener('click',()=>{let csv='日期,计划,完成组数,总组数,完成率,总时长,每组训练s,组间休息s,各组实际休息s,激活方式\n';hist.forEach(h=>{csv+=[h.d,h.n,h.done,h.tot,h.ok?'是':'否',h.total,h.wk,h.r,(h.rests||[]).join('/'),(h.acts||[]).join('/')].join(',')+'\n'});try{const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rowing-history.csv';a.click()}catch(e){}});
let st='idle',cfg=null,endTs=0,cur=0,lastRest=0,lastAct='',tick=null,restArr=[],actArr=[],lastCount=0;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function setPhase(cl,txt){$('#phaseTag').className='tag '+cl;$('#phaseTag').textContent=txt;$('#timer').className='timer '+cl;const s=cl==='work'?'var(--red)':cl==='await'?'var(--vio)':'var(--teal)';$('#bar').style.background='linear-gradient(90deg,var(--org),'+s+')'}
function toRun(){$('#viewConfig').style.display='none';$('#viewRun').style.display='block';$('#btnBack').style.display='inline-flex';$('#btnSkip').style.display=cfg.w>0?'':'none';$('#totSet').textContent=cfg.s;renderTimer()}
function renderTimer(){const left=(endTs-Date.now())/1000;$('#timer').textContent=st==='await'?'--:--':fmt(left);const dur=st==='work'?cfg.wk:st==='rest'?cfg.r:(st==='warm'?cfg.w*60:cfg.wk);$('#bar').style.width=st==='await'?'100%':Math.max(0,Math.min(100,(1-left/dur)*100))+'%';
const secLeft=Math.ceil(left);
if(st==='work'||st==='rest'){if(secLeft>=1&&secLeft<=5&&secLeft!==lastCount){lastCount=secLeft;speak(String(secLeft),true)}}else{lastCount=0}
if(st==='warm'){$('#phaseText').textContent='热身 · 轻划保持桨频 18-20';$('#curSet').textContent=0;$('#actHint').style.display='none';$('#btnActivate').style.display='none'}
else if(st==='work'){$('#phaseText').textContent='第 '+cur+' 组 · 全力冲刺';$('#curSet').textContent=cur;$('#actHint').style.display='none';$('#btnActivate').style.display='none';$('#timer').classList.toggle('urgent',left<=5)}
else if(st==='rest'){$('#phaseText').textContent='第 '+cur+' 组休息 · 轻松划恢复';$('#curSet').textContent=cur;$('#actHint').style.display='none';$('#btnActivate').style.display='none'}
else if(st==='await'){$('#phaseText').textContent='等待激活 · 语音/摇晃/拍击开始下一组';$('#curSet').textContent=cur;$('#actHint').style.display='block';$('#nextSet').textContent=cur+1;$('#btnActivate').style.display='block'}
$('#btnSkip').style.display=(st==='warm')?'':'none'}
function go(next,cl,lab){st=next;setPhase(cl,lab);endTs=Date.now()+(next==='warm'?cfg.w*60:next==='work'?cfg.wk:next==='rest'?cfg.r:0)*1000;stopTick();if(next==='await'){renderTimer();return}tick=setInterval(()=>{if(Date.now()>=endTs){onEnd()}else{renderTimer()}},100);renderTimer();if(next==='work'){speak('第 '+cur+' 组，开始')}}
function beginWork(n,act){cur=n;if(act)lastAct=act;go('work','work','第 '+cur+' 组 · 冲刺')}
function startNextSet(act){if(st!=='await')return;if(act){actArr[cur]=act}beginWork(cur+1,act)}
function onEnd(){
if(st==='warm'){beginWork(1)}
else if(st==='work'){if(cur>=cfg.s){finish(true)}else{go('rest','rest','休息')}}
else if(st==='rest'){lastRest=Math.round((Date.now()-(endTs-cfg.r*1000))/1000);if(restArr.length<cur)restArr[cur-1]=lastRest;go('await','await','等待激活')}
else if(st==='await'){renderTimer()}}
$('#btnStart').addEventListener('click',()=>{cfg=rec();cur=0;restArr=[];actArr=[];lastCount=0;if(cfg.w>0){go('warm','warm','热身')}else{beginWork(1)}toRun()});
$('#btnSkip').addEventListener('click',()=>{if(st==='warm'){beginWork(1)}});
$('#btnActivate').addEventListener('click',()=>startNextSet('按钮'));
function finish(ok){stopTick();const d=cfg,recs=hist.slice();let done=cur;
if(!ok){if(st==='work')done=Math.max(0,cur-1);else if(st==='warm')done=0;else done=cur}
const rests=(restArr||[]).slice(0,Math.max(0,done-1));const acts=(actArr||[]).slice(0,Math.max(0,done-1));
let totalSec=0;if(d.w>0)totalSec+=d.w*60;totalSec+=d.wk*done;rests.forEach(x=>totalSec+=x||0);
recs.push({d:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),n:P[plan].n,done,tot:d.s,ok,total:fmt(totalSec).replace(':','分')+'秒',wk:d.wk,r:d.r,rests,acts});
hist=recs;try{localStorage.setItem('rit_hist',JSON.stringify(hist))}catch(e){}renderHist();$('#btnBack').click()}
$('#btnCancel').addEventListener('click',()=>{if(!cfg)return;stopTick();st='idle';$('#viewRun').style.display='none';$('#viewConfig').style.display='block';$('#btnBack').style.display='none'});
$('#btnBack').addEventListener('click',()=>{stopTick();st='idle';$('#viewRun').style.display='none';$('#viewConfig').style.display='block';$('#btnBack').style.display='none'});
$('#btnEnd').addEventListener('click',()=>{finish(false)});
let shakeT=0;window.addEventListener('devicemotion',e=>{if(st!=='await')return;const a=e.accelerationIncludingGravity||{};const mag=Math.abs((a.x||0)+(a.y||0)+(a.z||0)-9.8);const thr={low:2.2,mid:3.2,high:4.2}[sens]||3.2;if(mag>thr&&Date.now()-shakeT>900){shakeT=Date.now();startNextSet('拍击')}});
let SR=window.SpeechRecognition||window.webkitSpeechRecognition,sr=null,srLive=false,srFail=0;
function startSR(){if(!SR||srLive)return;try{sr.start();srLive=true;voiceUI(true)}catch(e){srLive=false;setTimeout(startSR,800)}}
if(SR){sr=new SR();sr.lang='zh-CN';sr.continuous=true;sr.interimResults=false;
sr.onresult=e=>{if(st!=='await')return;const rs=e.results;if(!rs.length)return;const r=rs[rs.length-1];if(!r.isFinal)return;const t=r[0].transcript.replace(/\s/g,'');if(/下一组|开始|8848|八个八|八八四八/.test(t)){startNextSet('语音')}};
sr.onend=()=>{srLive=false;srFail=0;voiceUI(false);setTimeout(startSR,400)};
sr.onerror=e=>{srLive=false;voiceUI(false);if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceUI(null,'语音识别不可用：麦克风权限被拒')}else{srFail++;if(srFail>6){voiceUI(null,'语音识别反复出错，已停用 · 可用拍击/按钮')}else{setTimeout(startSR,600)}}};
startSR();}else{voiceUI(null,'当前浏览器不支持语音识别 · 可用拍击/按钮')}
renderSum();renderHist();
</script>
</body>
</html>
