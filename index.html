      <button data-page-node-id="K2TMXKkyRyqN9YIS4FXqoz" class="skipwarm" id="btnSkip"><!--pnid:r8kbuNESy6e3OR0zldVSe3-->跳过热身</button>
      <button data-page-node-id="UHkgtE2wSkVuCLBH26bhzS" class="endall" id="btnEnd"><!--pnid:3uw4RzYP9MQpGEwTIhrBXA-->提前结束</button>

<div data-page-node-id="thVrRbdd7i3dMvqChNxxf4" class="demo" id="demo"><!--pnid:Xaa4bJdNcaWTJxcTRJMZQt-->· 版本 v8 · 语音识别自动重启修复 · 每组冲刺播报「第 X 组」 · 配色美化</div>
</div>
<script data-page-node-id="m5PsZ9a5EaOn5NWcpTA0tE" data-pnid-children="gIh26KUg6JHIRpG8QeI0Wx">
const $=s=>document.querySelector(s);
const P=[{w:5,wk:60,r:60,s:5,n:'入门冲刺'},{w:5,wk:110,r:180,s:6,n:'距离冲刺 250m'},{w:5,wk:40,r:120,s:8,n:'进阶冲刺'}];
let plan=0,sens='mid',hist=[];
try{hist=JSON.parse(localStorage.getItem('rit_hist')||'[]')}catch(e){}
if(!hist.length){hist=[{d:'10月15日 19:16',n:'入门冲刺',done:5,tot:5,ok:true,total:'15分12秒',wk:60,r:60,rests:[68,72,96,75],acts:['语音','语音','语音','拍击']},{d:'10月13日 21:01',n:'入门冲刺',done:2,tot:6,ok:false,total:'34秒',wk:10,r:10,rests:[20],acts:['语音']}]}
const rec=()=>{const p=P[plan];return{w:Math.max(0,parseFloat($('#inWarm').value||0)),wk:Math.max(5,parseInt($('#inWork').value)||60),r:Math.max(5,parseInt($('#inRest').value)||60),s:Math.max(1,Math.min(20,parseInt($('#inSets').value)||5))}};
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1;u.pitch=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.toLowerCase().indexOf('zh')===0)||vs.find(x=>x.lang&&x.lang.toLowerCase().indexOf('cmn')===0);if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function voiceUI(ok,msg){const el=$('#vst'),tx=$('#vstText');el.className='vst '+(ok?'live':ok===false?'dead':'');tx.textContent=msg||(ok?'语音识别：聆听中':'语音识别：已停止，恢复中…')}
function renderSum(){const c=rec();$('#sum').innerHTML='';const a=[['热身',c.w+' 分'],['冲刺',c.wk+' 秒'],['休息',c.r+' 秒'],['组数',c.s+' 组']];a.forEach(x=>{const s=document.createElement('span');s.className='chip';s.innerHTML=x[0]+' <b>'+x[1]+'</b>';$('#sum').appendChild(s)})}
function renderHist(){const ul=$('#hist');ul.innerHTML='';if(!hist.length){ul.innerHTML='<li class="hrow" style="color:var(--dim);font-size:11px">暂无记录</li>';return}
hist.slice().reverse().forEach(h=>{const li=document.createElement('li');li.className='hrow';
const pct=Math.round(h.done/h.tot*100);
let setHtml='';h.rests.forEach((r,i)=>{setHtml+='<em>第'+(i+1)+'组休 <b>'+r+'</b>s <span class='+(h.acts[i]==='语音'?'v':h.acts[i]==='拍击'?'p':'')+'>'+(h.acts[i]||'-')+'</span></em>'});
li.innerHTML='<div class="htop"><b>'+h.n+'</b><span class="htag '+(h.ok?'ok':'ab')+'">'+(h.ok?'完成 ':'提前结束 ')+h.done+'/'+h.tot+' · '+pct+'%</span></div>'+
'<div class="hmid"><span>'+h.d+'</span><span>总时长 <i>'+h.total+'</i></span><span>训练 <i>'+h.wk+'s</i> / 休息 <i>'+h.r+'s</i></span></div>'+
'<div class="hset">'+setHtml+'</div>';ul.appendChild(li)})}
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{plan=+b.dataset.p;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const p=P[plan];$('#inWarm').value=p.w;$('#inWork').value=p.wk;$('#inRest').value=p.r;$('#inSets').value=p.s;renderSum()}));
['inWarm','inWork','inRest','inSets'].forEach(id=>$('#'+id).addEventListener('input',renderSum));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{sens=b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}));
let wl=null;
$('#btnAwake').addEventListener('click',async()=>{try{if(wl){await wl.release();wl=null;$('#btnAwake').classList.remove('on')}else if('wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');$('#btnAwake').classList.add('on');wl.addEventListener('release',()=>{$('#btnAwake').classList.remove('on');wl=null})}else{$('#btnAwake').textContent='不支持'}}catch(e){$('#btnAwake').textContent='失败'}});
$('#btnTestVoice').addEventListener('click',()=>{speak('第 1 组，开始');setTimeout(()=>speak('第 2 组，开始'),1600)});
$('#btnExport').addEventListener('click',()=>{let csv='日期,计划,完成组数,总组数,完成率,总时长,每组训练s,组间休息s,各组实际休息s,激活方式\n';hist.forEach(h=>{csv+=[h.d,h.n,h.done,h.tot,h.ok?'是':'否',h.total,h.wk,h.r,h.rests.join('/'),h.acts.join('/')].join(',')+'\n'});try{const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rowing-history.csv';a.click()}catch(e){} });
let st='idle',cfg=null,endTs=0,cur=0,lastRest=0,lastAct='',tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function setPhase(cl,txt){$('#phaseTag').className='tag '+cl;$('#phaseTag').textContent=txt;$('#timer').className='timer '+cl;const s=cl==='work'?'var(--red)':cl==='await'?'var(--vio)':'var(--teal)';$('#bar').style.background='linear-gradient(90deg,var(--org),'+s+')'}
function toRun(){$('#viewConfig').style.display='none';$('#viewRun').style.display='block';$('#btnBack').style.display='inline-flex';$('#btnSkip').style.display=cfg.w>0?'':'none';$('#totSet').textContent=cfg.s;renderTimer()}
function renderTimer(){const left=(endTs-Date.now())/1000;$('#timer').textContent=fmt(left);const dur=st==='work'?cfg.wk:st==='rest'?cfg.r:(st==='warm'?cfg.w*60:cfg.wk);$('#bar').style.width=Math.max(0,Math.min(100,(1-left/dur)*100))+'%';
if(st==='warm'){$('#phaseText').textContent='热身 · 轻划保持桨频 18-20';$('#curSet').textContent=0;$('#actHint').style.display='none';$('#btnActivate').style.display='none'}
else if(st==='work'){$('#phaseText').textContent='第 '+cur+' 组 · 全力冲刺';$('#curSet').textContent=cur;$('#actHint').style.display='none';$('#btnActivate').style.display='none';$('#timer').classList.toggle('urgent',left<=5)}
else if(st==='rest'){$('#phaseText').textContent='休息 · 轻松划恢复';$('#curSet').textContent=cur;$('#actHint').style.display='none';$('#btnActivate').style.display='none'}
else if(st==='await'){$('#phaseText').textContent='等待激活 · 心率恢复后开始';$('#curSet').textContent=cur;$('#actHint').style.display='block';$('#nextSet').textContent=cur+1;$('#btnActivate').style.display='block'}
$('#btnSkip').style.display=(st==='warm')?'':'none'}
function go(next,cl,lab){st=next;setPhase(cl,lab);endTs=Date.now()+(next==='warm'?cfg.w*60:next==='work'?cfg.wk:next==='rest'?cfg.r:0)*1000;stopTick();tick=setInterval(()=>{if(Date.now()>=endTs){onEnd()}else{renderTimer()}},100);renderTimer();if(next==='work'){speak('第 '+cur+' 组，开始')}}
function onEnd(){
if(st==='warm'){go('work','work','第 1 组 · 冲刺')}
else if(st==='work'){if(cur>=cfg.s){finish(true)}else{go('rest','rest','休息')}}
else if(st==='rest'){lastRest=Math.round((Date.now()-(endTs-cfg.r*1000))/1000);go('await','await','等待激活')}
else if(st==='await'){renderTimer()}}
$('#btnStart').addEventListener('click',()=>{cfg=rec();cur=1;lastRest=0;if(cfg.w>0){go('warm','warm','热身')}else{go('work','work','第 1 组 · 冲刺')}toRun()});
$('#btnSkip').addEventListener('click',()=>{if(st==='warm'){go('work','work','第 1 组 · 冲刺')}});
$('#btnActivate').addEventListener('click',()=>{if(st!=='await')return;lastAct='按钮';go('work','work','第 '+cur+' 组 · 冲刺')});
function finish(ok){stopTick();const d=cfg,recs=hist.slice();let totalSec=0;if(d.w>0)totalSec+=d.w*60;totalSec+=d.wk*d.s+(lastRest||0);recs.push({d:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),n:P[plan].n,done:cur,tot:d.s,ok,total:fmt(totalSec).replace(':','分')+'秒',wk:d.wk,r:d.r,rests:d.rests||[],acts:d.acts||[]});hist=recs;try{localStorage.setItem('rit_hist',JSON.stringify(hist))}catch(e){}renderHist();$('#btnBack').click()}
$('#btnCancel').addEventListener('click',()=>{if(!cfg)return;stopTick();st='idle';$('#viewRun').style.display='none';$('#viewConfig').style.display='block';$('#btnBack').style.display='none'});
$('#btnBack').addEventListener('click',()=>{stopTick();st='idle';$('#viewRun').style.display='none';$('#viewConfig').style.display='block';$('#btnBack').style.display='none'});
$('#btnEnd').addEventListener('click',()=>{if(st==='warm'&&cur<=1){finish(false);return}finish(false)});
let shakeT=0;window.addEventListener('devicemotion',e=>{if(st!=='await')return;const a=e.accelerationIncludingGravity||{};const mag=Math.abs((a.x||0)+(a.y||0)+(a.z||0)-9.8);const thr={low:2.2,mid:3.2,high:4.2}[sens]||3.2;if(mag>thr&&Date.now()-shakeT>900){shakeT=Date.now();lastAct='拍击';go('work','work','第 '+cur+' 组 · 冲刺')}});
let SR=window.SpeechRecognition||window.webkitSpeechRecognition,sr=null,srLive=false,srFail=0;
function startSR(){if(!SR||srLive)return;try{sr.start();srLive=true;voiceUI(true)}catch(e){srLive=false;setTimeout(startSR,800)}}
if(SR){sr=new SR();sr.lang='zh-CN';sr.continuous=true;sr.interimResults=false;
sr.onresult=e=>{if(st!=='await')return;const rs=e.results;if(!rs.length)return;const t=rs[rs.length-1][0].transcript.replace(/\s/g,'');if(/下一组|开始|8848|八个八|八八四八/.test(t)){lastAct='语音';go('work','work','第 '+cur+' 组 · 冲刺')}};
sr.onend=()=>{srLive=false;srFail=0;voiceUI(false);setTimeout(startSR,400)};
sr.onerror=e=>{srLive=false;voiceUI(false);if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceUI(null,'语音识别不可用：麦克风权限被拒')}else{srFail++;if(srFail>6){voiceUI(null,'语音识别反复出错，已停用 · 可用拍击/按钮')}else{setTimeout(startSR,600)}}};
startSR();}else{voiceUI(null,'当前浏览器不支持语音识别 · 可用拍击/按钮')}
renderSum();renderHist();
</script>
</body>
